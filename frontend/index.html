    <!-- Instant 0ms Inline Theme & Adaptive Home Screen Icon Handler -->
    <script>
      (function() {
        try {
          // 1. System appearance check (iPhone / Android prefers-color-scheme)
          var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
          var isSystemDark = mql ? mql.matches : false;

          // 2. Select appropriate icon and manifest for system appearance
          var targetAppleIcon = isSystemDark ? '/apple-touch-icon-dark.png' : '/apple-touch-icon.png';
          var targetManifest = isSystemDark ? '/manifest-dark.json' : '/manifest.json';

          // 3. Immediately set apple-touch-icon BEFORE browser captures Home Screen icon
          var appleIconEl = document.getElementById('apple-touch-icon-main');
          if (appleIconEl) {
            appleIconEl.setAttribute('href', targetAppleIcon);
          }
          var applePrecomposedEl = document.getElementById('apple-touch-icon-precomposed');
          if (applePrecomposedEl) {
            applePrecomposedEl.setAttribute('href', targetAppleIcon);
          }

          // 4. Set PWA manifest (manifest.json for light, manifest-dark.json for dark)
          var manifestEl = document.getElementById('manifest-link');
          if (manifestEl) {
            manifestEl.setAttribute('href', targetManifest);
          }

          // 5. Real-time listener: updates icon if appearance changes in iOS Control Center while page is open
          function onSystemAppearanceChange(e) {
            var dark = e.matches;
            var newIcon = dark ? '/apple-touch-icon-dark.png' : '/apple-touch-icon.png';
            var newManifest = dark ? '/manifest-dark.json' : '/manifest.json';
            if (appleIconEl) appleIconEl.setAttribute('href', newIcon);
            if (applePrecomposedEl) applePrecomposedEl.setAttribute('href', newIcon);
            if (manifestEl) manifestEl.setAttribute('href', newManifest);
          }

          if (mql && mql.addEventListener) {
            mql.addEventListener('change', onSystemAppearanceChange);
          } else if (mql && mql.addListener) {
            mql.addListener(onSystemAppearanceChange);
          }

          // 6. Website UI theme initialization (preserves existing website theme behavior)
          var savedTheme = localStorage.getItem('theme') || localStorage.getItem('mentornearby-theme');
          var isUiDark = savedTheme === 'dark';
          if (isUiDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (_) {}
      })();
    </script>

    <!-- Inline Critical Styles for MentorNearby PWA Splash Launch -->
    <style id="pwa-splash-styles">
      html, body {
        background-color: #FFFFFF;
        margin: 0;
        padding: 0;
      }
      #pwa-splash-screen,
      html.dark #pwa-splash-screen,
      body.dark #pwa-splash-screen,
      [data-theme="dark"] #pwa-splash-screen {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        background-color: #FFFFFF !important;
        background: #FFFFFF !important;
        background-image: none !important;
        color: #1E293B !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        align-items: center !important;
        z-index: 9999999 !important;
        box-sizing: border-box !important;
        padding: calc(44px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)) !important;
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif !important;
        opacity: 1 !important;
        transition: opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1), transform 0.38s cubic-bezier(0.4, 0, 0.2, 1) !important;
        pointer-events: auto !important;
        user-select: none !important;
        -webkit-user-select: none !important;
      }
      #pwa-splash-screen.fade-out {
        opacity: 0 !important;
        transform: scale(1.02) !important;
        pointer-events: none !important;
      }

        margin: 0 auto;

      }
      #pwa-splash-screen .mn-splash-spinner,
      html.dark #pwa-splash-screen .mn-splash-spinner,
      body.dark #pwa-splash-screen .mn-splash-spinner {
