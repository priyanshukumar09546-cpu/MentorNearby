    <!-- Inline Critical Styles for MentorNearby PWA Splash Launch -->
    <style id="pwa-splash-styles">
      html, body {
        background-color: #FAF8F5;
        margin: 0;
        padding: 0;
      }
      #pwa-splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #FAF8F5;
        background-image: 
          radial-gradient(ellipse 65% 50% at 0% 0%, rgba(254, 226, 226, 0.55) 0%, rgba(254, 226, 226, 0.15) 50%, transparent 80%),
          radial-gradient(ellipse 60% 50% at 100% 100%, rgba(254, 243, 199, 0.65) 0%, rgba(254, 243, 199, 0.18) 50%, transparent 80%);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        z-index: 9999999;
        box-sizing: border-box;
        padding: calc(44px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        opacity: 1;
        transition: opacity 0.38s cubic-bezier(0.4, 0, 0.2, 1), transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
      }
      #pwa-splash-screen.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .mn-splash-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        width: 100%;
        max-width: 440px;
        margin: auto 0;
      }
      .mn-splash-logo {
        width: 232px;
        max-width: 72vw;
        height: auto;
        object-fit: contain;
        display: block;
        margin: 0 auto;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.03));
      }
      .mn-splash-spinner {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 3.5px solid rgba(217, 119, 6, 0.12);
        border-top-color: #D97706;
        border-right-color: #F59E0B;
        animation: mnSplashSpin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        margin: 36px auto 14px;
      }
      .mn-splash-text {
        font-size: 13.5px;
        font-weight: 500;
        color: #64748B;
        margin: 0;
        letter-spacing: -0.1px;
      }
      .mn-splash-footer {
        flex-shrink: 0;
        text-align: center;
        margin-top: auto;
      }
      .mn-splash-tagline {
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #1E293B;
        text-transform: uppercase;
        margin: 0;
        line-height: 1.6;
      }
      .mn-splash-bar {
        width: 36px;
        height: 1.5px;
        background-color: #D97706;
        margin: 8px auto 0;
        border-radius: 2px;
      }
      @keyframes mnSplashSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
